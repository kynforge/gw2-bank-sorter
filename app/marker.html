<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GW2 Companion markers</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  .ring { position: absolute; border: 3px solid #5dbfac; border-radius: 8px; box-shadow: 0 0 0 2px rgba(0, 0, 0, .65), 0 0 16px #5dbfac; }
  .ring.to { border-color: #e8bd3d; box-shadow: 0 0 0 2px rgba(0, 0, 0, .65), 0 0 16px #e8bd3d; }
  .ring.warn { border-color: #ec7f7f; box-shadow: 0 0 0 2px rgba(0, 0, 0, .65), 0 0 16px #ec7f7f; }
  .label { position: absolute; transform: translate(-50%, -100%); font: 700 13px/1.25 "Segoe UI", system-ui, sans-serif; color: #fff;
           background: rgba(0, 0, 0, .78); padding: 2px 7px; border-radius: 4px; white-space: nowrap; }
</style>
</head>
<body>
<script type="module" src="/src/marker.js"></script>
</body>
</html>
