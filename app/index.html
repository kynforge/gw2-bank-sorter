<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GW2 Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Marcellus+SC&display=swap">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-deposit" viewBox="0 0 16 16"><path d="M8 2v7M4.5 6 8 9.5 11.5 6M2.5 11v2.5h11V11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-use" viewBox="0 0 16 16"><path d="M8 1.5 9.6 6.4 14.5 8 9.6 9.6 8 14.5 6.4 9.6 1.5 8 6.4 6.4Z" fill="currentColor"/></symbol>
  <symbol id="i-vendor" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="8" r="1.8" fill="currentColor"/></symbol>
  <symbol id="i-salvage" viewBox="0 0 16 16"><path d="M2.5 13.5 9 7M7.5 2.5l6 6-2.2 2.2-6-6Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></symbol>
  <symbol id="i-sell" viewBox="0 0 16 16"><path d="M2 2.5h5.5L14 9l-5 5-6.5-6.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="5.5" cy="5.8" r="1.4" fill="currentColor"/></symbol>
  <symbol id="i-stack" viewBox="0 0 16 16"><rect x="2" y="5.5" width="8.5" height="8.5" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5.5 2h8.5v8.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-destroy" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-star" viewBox="0 0 16 16"><path d="M8 1.6l1.9 4.1 4.5.5-3.4 3 1 4.4L8 11.3 4 13.6l1-4.4-3.4-3 4.5-.5Z" fill="currentColor"/></symbol>
  <symbol id="i-copy" viewBox="0 0 16 16"><rect x="5" y="5" width="8.5" height="8.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 10.5V3.6c0-.3.3-.6.6-.6h6.9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
</svg>

<div class="shell" id="shell">
  <header class="titlebar" data-tauri-drag-region>
    <span class="brand" data-tauri-drag-region>GW2 Companion</span>
    <span class="ct-flag" id="ctFlag" hidden>Click-through on · Ctrl+Shift+C to turn off</span>
    <div class="winbtns">
      <button type="button" id="winMin" aria-label="Minimize" title="Minimize">&#x2013;</button>
      <button type="button" id="winClose" aria-label="Close" title="Close">&#x00D7;</button>
    </div>
  </header>
  <nav class="tabbar" id="tabbar" role="tablist" aria-label="Tools"></nav>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <main class="panels" id="panels"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
